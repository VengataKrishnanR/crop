[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccre-onboarding"
version = "1.0.0"
description = "CCRE Rules Intelligence & Onboarding Platform (Google ADK)"
requires-python = ">=3.11"

[project.scripts]
ccre = "server.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["components*", "tools*", "server*"]

[tool.setuptools.package-data]
"components.llm" = ["*.yaml"]
"tools.agents" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
